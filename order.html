<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASTER4｜下單</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- Header -->

  <header class="site-header">

    <div class="header-inner">

      <a
        href="index.html"
        class="logo"
      >
        ASTER4
      </a>


      <a
        href="order-search.html"
        class="order-link"
      >
        訂單查詢
      </a>

    </div>

  </header>



  <!-- Order Page -->

  <main class="order-page">


    <section
      id="order-product"
      class="order-product"
    >

      載入商品中...

    </section>



    <section
      class="order-form-section"
    >

      <h2>
        訂購資訊
      </h2>


      <form
        id="order-form"
      >

        <div class="form-group">

          <label>
            姓名
          </label>

          <input
            type="text"
            id="customer-name"
            required
          >

        </div>



        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            id="customer-email"
            required
          >

        </div>



        <div class="form-group">

          <label>
            社群帳號
          </label>

          <input
            type="text"
            id="social-account"
            required
          >

        </div>



        <div class="form-group">

          <label>
            購買數量
          </label>

          <input
            type="number"
            id="quantity"
            min="1"
            value="1"
            required
          >

        </div>



        <button
          type="submit"
          class="submit-button"
        >
          送出訂單
        </button>


      </form>

    </section>


  </main>



  <script src="order.js"></script>


</body>

</html>
