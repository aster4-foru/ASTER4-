<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASTER4｜確認訂單</title>


  <style>

    /* =====================================================
       ASTER4 CHECKOUT
       獨立頁面樣式
    ===================================================== */


    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      padding: 0;
    }


    body {
      margin: 0;
      padding: 0;

      background: #f7f5f1;

      color: #242424;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button,
    input,
    select,
    textarea {
      font: inherit;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .site-header {
      width: 100%;

      background: #f7f5f1;

      border-bottom: 1px solid #dedbd5;
    }


    .header-inner {
      width: min(1180px, calc(100% - 48px));

      height: 76px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    .logo {
      color: #1f1f1f;

      font-size: 20px;
      font-weight: 800;

      letter-spacing: 0.12em;
    }


    .header-nav {
      display: flex;
      align-items: center;

      gap: 32px;
    }


    .header-nav a {
      color: #666;

      font-size: 12px;
      font-weight: 500;

      transition: color 0.2s ease;
    }


    .header-nav a:hover {
      color: #111;
    }


    #cart-count {
      display: inline-flex;

      min-width: 18px;
      height: 18px;

      margin-left: 4px;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #222;

      color: #fff;

      font-size: 9px;
    }


    /* =====================================================
       MAIN
    ===================================================== */

    .checkout-page {
      width: min(1080px, calc(100% - 48px));

      margin: 0 auto;

      padding: 76px 0 100px;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .checkout-hero {
      margin-bottom: 72px;
    }


    .checkout-hero-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 25px;

      color: #9b9892;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.24em;
    }


    .checkout-hero h1 {
      margin: 0;

      color: #1d1d1d;

      font-size: clamp(48px, 7vw, 76px);

      line-height: 0.95;

      font-weight: 750;

      letter-spacing: -0.06em;
    }


    .checkout-hero p {
      margin: 23px 0 0;

      color: #898680;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       SECTION HEADING
    ===================================================== */

    .section-heading {
      padding-bottom: 19px;

      border-bottom: 1px solid #d8d5cf;
    }


    .section-heading span {
      display: block;

      margin-bottom: 8px;

      color: #9a9791;

      font-size: 9px;
      font-weight: 650;

      letter-spacing: 0.25em;
    }


    .section-heading h2 {
      margin: 0;

      color: #252525;

      font-size: 22px;
      font-weight: 650;

      letter-spacing: -0.025em;
    }


    /* =====================================================
       ORDER
    ===================================================== */

    .checkout-order {
      margin: 0;
    }


    .checkout-items {
      width: 100%;
    }


    .checkout-item {
      display: grid;

      grid-template-columns: 150px minmax(0, 1fr);

      gap: 30px;

      padding: 30px 0;

      border-bottom: 1px solid #dedbd5;
    }


    .checkout-item-image {
      width: 150px;
      height: 150px;

      overflow: hidden;

      background: #ebe8e2;
    }


    .checkout-item-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    .checkout-no-image {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #aaa;

      font-size: 10px;

      letter-spacing: 0.2em;
    }


    .checkout-item-info {
      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }


    .checkout-item-group {
      margin-bottom: 5px;

      color: #aaa;

      font-size: 10px;

      letter-spacing: 0.12em;
    }


    .checkout-item-channel {
      margin-bottom: 8px;

      color: #888;

      font-size: 11px;
    }


    .checkout-item-info h3 {
      margin: 0;

      color: #242424;

      font-size: 20px;

      line-height: 1.45;

      font-weight: 650;

      letter-spacing: -0.025em;
    }


    .checkout-item-version {
      margin-top: 7px;

      color: #777;

      font-size: 13px;
    }


    .checkout-item-bottom {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-top: 25px;
    }


    .checkout-item-bottom span {
      color: #999;

      font-size: 12px;
    }


    .checkout-item-bottom strong {
      color: #222;

      font-size: 17px;

      font-weight: 700;
    }


    /* =====================================================
       TOTAL
    ===================================================== */

    .checkout-total-area {
      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      padding: 30px 0;

      margin: 42px 0 90px;

      border-top: 2px solid #252525;

      border-bottom: 1px solid #d8d5cf;
    }


    .checkout-total-label > span {
      display: block;

      margin-bottom: 12px;

      color: #9a9791;

      font-size: 9px;
      font-weight: 650;

      letter-spacing: 0.25em;
    }


    .checkout-total-label p {
      margin: 0;

      color: #666;

      font-size: 13px;
    }


    .checkout-total-label p strong {
      margin-left: 8px;

      color: #222;

      font-weight: 650;
    }


    .checkout-total-price {
      text-align: right;
    }


    .checkout-total-price span {
      display: block;

      margin-bottom: 7px;

      color: #8d8982;

      font-size: 11px;
    }


    .checkout-total-price strong {
      color: #1e1e1e;

      font-size: 36px;

      line-height: 1;

      font-weight: 750;

      letter-spacing: -0.05em;
    }


    /* =====================================================
       INFORMATION
    ===================================================== */

    .checkout-information {
      margin: 0;
    }


    .checkout-form {
      padding-top: 38px;
    }


    .form-row {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 34px;

      margin-bottom: 32px;
    }


    .form-group {
      min-width: 0;
    }


    .form-group label {
      display: block;

      margin-bottom: 10px;

      color: #444;

      font-size: 11px;
      font-weight: 650;
    }


    .form-group input,
    .form-group select,
    .form-group textarea {
      display: block;

      width: 100%;

      padding: 13px 0;

      border: 0;

      border-bottom: 1px solid #c9c6bf;

      border-radius: 0;

      outline: none;

      background: transparent;

      color: #222;

      font-size: 14px;

      transition:
        border-color 0.2s ease;
    }


    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #aaa;
    }


    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-bottom-color: #222;
    }


    .form-group textarea {
      min-height: 110px;

      padding-top: 13px;

      resize: vertical;
    }


    .form-note {
      margin-top: 5px;
    }


    /* =====================================================
       SUBMIT
    ===================================================== */

    .checkout-submit-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 30px;

      margin-top: 48px;

      padding-top: 25px;

      border-top: 1px solid #d8d5cf;
    }


    .checkout-submit-row p {
      margin: 0;

      color: #999;

      font-size: 11px;

      line-height: 1.6;
    }


    .checkout-submit {
      flex-shrink: 0;

      min-width: 230px;

      padding: 17px 30px;

      border: 0;

      border-radius: 2px;

      background: #222;

      color: #fff;

      font-size: 12px;
      font-weight: 650;

      letter-spacing: 0.08em;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }


    .checkout-submit:hover {
      background: #444;
    }


    .checkout-submit:active {
      transform: translateY(1px);
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .checkout-empty {
      padding: 70px 0;

      text-align: center;
    }


    .checkout-empty p {
      margin: 0;

      color: #999;

      font-size: 14px;
    }


    .back-to-shop {
      display: inline-block;

      margin-top: 18px;

      color: #222;

      font-size: 12px;

      text-decoration: underline;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {


      .header-inner {
        width: calc(100% - 30px);

        height: 65px;
      }


      .logo {
        font-size: 17px;
      }


      .header-nav {
        gap: 15px;
      }


      .header-nav a {
        font-size: 11px;
      }


      .checkout-page {
        width: calc(100% - 30px);

        padding: 45px 0 65px;
      }


      .checkout-hero {
        margin-bottom: 48px;
      }


      .checkout-hero-top {
        margin-bottom: 20px;
      }


      .checkout-hero h1 {
        font-size: 45px;
      }


      .checkout-hero p {
        margin-top: 17px;

        font-size: 13px;
      }


      .section-heading h2 {
        font-size: 20px;
      }


      .checkout-item {
        grid-template-columns: 88px minmax(0, 1fr);

        gap: 16px;

        padding: 21px 0;
      }


      .checkout-item-image {
        width: 88px;
        height: 88px;
      }


      .checkout-item-info h3 {
        font-size: 15px;
      }


      .checkout-item-version {
        font-size: 12px;
      }


      .checkout-item-bottom {
        margin-top: 14px;
      }


      .checkout-item-bottom span {
        font-size: 10px;
      }


      .checkout-item-bottom strong {
        font-size: 14px;
      }


      .checkout-total-area {
        margin: 28px 0 60px;

        padding: 25px 0;
      }


      .checkout-total-price strong {
        font-size: 28px;
      }


      .form-row {
        grid-template-columns: 1fr;

        gap: 25px;

        margin-bottom: 25px;
      }


      .checkout-submit-row {
        flex-direction: column;

        align-items: stretch;

        margin-top: 35px;
      }


      .checkout-submit {
        width: 100%;
      }

    }

  </style>

</head>



<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <div class="header-inner">

      <a
        href="index.html"
        class="logo"
      >
        ASTER4
      </a>


      <nav class="header-nav">

        <a href="index.html">
          首頁
        </a>

        <a href="cart.html">
          購物車
          <span id="cart-count">0</span>
        </a>

        <a href="order-search.html">
          訂單查詢
        </a>

      </nav>

    </div>

  </header>



  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="checkout-page">


    <!-- HERO -->

    <section class="checkout-hero">

      <div class="checkout-hero-top">

        <span>
          CHECKOUT
        </span>

        <span>
          ASTER4
        </span>

      </div>


      <h1>
        確認訂單
      </h1>


      <p>
        確認商品內容，再填寫訂購資訊
      </p>

    </section>



    <!-- ORDER -->

    <section class="checkout-order">

      <div class="section-heading">

        <span>
          YOUR ORDER
        </span>

        <h2>
          訂單商品
        </h2>

      </div>


      <div
        id="checkout-items"
        class="checkout-items"
      ></div>

    </section>



    <!-- TOTAL -->

    <section class="checkout-total-area">

      <div class="checkout-total-label">

        <span>
          ORDER SUMMARY
        </span>

        <p>
          商品
          <strong id="checkout-item-count">
            —
          </strong>
        </p>

      </div>


      <div class="checkout-total-price">

        <span>
          訂單總額
        </span>

        <strong id="checkout-total">
          NT$ 0
        </strong>

      </div>

    </section>



    <!-- INFORMATION -->

    <section class="checkout-information">

      <div class="section-heading">

        <span>
          INFORMATION
        </span>

        <h2>
          訂購人資料
        </h2>

      </div>


      <form
        id="checkout-form"
        class="checkout-form"
      >


        <div class="form-row">


          <div class="form-group">

            <label for="customer-name">
              本名姓名
            </label>

            <input
              type="text"
              id="customer-name"
              name="customerName"
              placeholder="請輸入姓名"
              required
            >

          </div>


          <div class="form-group">

            <label for="social-account">
              社群帳號
            </label>

            <input
              type="text"
              id="social-account"
              name="socialAccount"
              placeholder="例如：Instagram / Threads"
              required
            >

          </div>


        </div>



        <div class="form-row">


          <div class="form-group">

            <label for="phone">
              手機號碼
            </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="請輸入手機號碼"
              required
            >

          </div>


          <div class="form-group">

            <label for="delivery">
              取貨方式
            </label>

            <select
              id="delivery"
              name="delivery"
              required
            >

              <option value="">
                請選擇取貨方式
              </option>

              <option value="賣貨便">
                賣貨便
              </option>

              <option value="7-11店到店">
                7-11 店到店
              </option>

              <option value="其他">
                其他
              </option>

            </select>

          </div>


        </div>



        <div class="form-group form-note">

          <label for="note">
            備註
          </label>

          <textarea
            id="note"
            name="note"
            rows="4"
            placeholder="有其他想告訴 ASTER4 的事情，可以寫在這裡"
          ></textarea>

        </div>



        <div class="checkout-submit-row">

          <p>
            送出前請確認商品數量與訂購資訊
          </p>


          <button
            type="submit"
            class="checkout-submit"
          >
            確認送出訂單
          </button>

        </div>


      </form>

    </section>


  </main>



  <script src="checkout.js"></script>

</body>

</html>
