```html
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASTER4｜確認訂單</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      padding: 0;
    }


    body {
      margin: 0;

      background: #f7f5f1;

      color: #252525;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button,
    input,
    select,
    textarea {
      font: inherit;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .site-header {
      border-bottom: 1px solid #dedbd5;

      background: #f7f5f1;
    }


    .header-inner {
      width: min(1080px, calc(100% - 40px));

      height: 70px;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .logo {
      font-size: 19px;

      font-weight: 800;

      letter-spacing: 0.12em;
    }


    .header-nav {
      display: flex;

      align-items: center;

      gap: 28px;
    }


    .header-nav a {
      color: #777;

      font-size: 12px;
    }


    .header-nav a:hover {
      color: #222;
    }


    #cart-count {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 18px;
      height: 18px;

      margin-left: 3px;

      border-radius: 50%;

      background: #222;

      color: #fff;

      font-size: 9px;
    }


    /* =====================================================
       PAGE
    ===================================================== */

    .checkout-page {
      width: min(960px, calc(100% - 40px));

      margin: 0 auto;

      padding: 58px 0 80px;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .checkout-hero {
      margin-bottom: 52px;
    }


    .checkout-hero-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

      color: #99958e;

      font-size: 9px;

      font-weight: 650;

      letter-spacing: 0.25em;
    }


    .checkout-hero h1 {
      margin: 0;

      font-size: clamp(38px, 5vw, 54px);

      line-height: 1;

      font-weight: 750;

      letter-spacing: -0.045em;
    }


    .checkout-hero p {
      margin: 15px 0 0;

      color: #898680;

      font-size: 13px;
    }


    /* =====================================================
       SECTION TITLE
    ===================================================== */

    .section-heading {
      padding-bottom: 17px;

      border-bottom: 1px solid #d7d4ce;
    }


    .section-heading span {
      display: block;

      margin-bottom: 7px;

      color: #9b9892;

      font-size: 9px;

      font-weight: 650;

      letter-spacing: 0.24em;
    }


    .section-heading h2 {
      margin: 0;

      font-size: 20px;

      font-weight: 650;

      letter-spacing: -0.025em;
    }


    /* =====================================================
       ORDER DETAIL
    ===================================================== */

    .checkout-items {
      width: 100%;
    }


    .checkout-item {
      display: grid;

      grid-template-columns: minmax(0, 1fr) auto;

      column-gap: 40px;

      padding: 24px 0;

      border-bottom: 1px solid #dedbd5;
    }


    .checkout-item-info {
      min-width: 0;
    }


    .checkout-item-group {
      display: inline-block;

      margin-bottom: 7px;

      color: #8d8982;

      font-size: 10px;

      font-weight: 650;

      letter-spacing: 0.08em;
    }


    .checkout-item-channel {
      margin-bottom: 5px;

      color: #999;

      font-size: 11px;
    }


    .checkout-item-info h3 {
      margin: 0;

      color: #252525;

      font-size: 17px;

      line-height: 1.5;

      font-weight: 650;
    }


    .checkout-item-version {
      margin-top: 5px;

      color: #777;

      font-size: 12px;
    }


    .checkout-item-bottom {
      display: flex;

      align-items: center;

      gap: 20px;

      margin-top: 15px;
    }


    .checkout-item-bottom span {
      color: #8e8a83;

      font-size: 12px;
    }


    .checkout-item-bottom strong {
      display: none;
    }


    /* =====================================================
       ITEM PRICE
    ===================================================== */

    .checkout-item-price {
      align-self: center;

      text-align: right;

      white-space: nowrap;
    }


    .checkout-item-price small {
      display: block;

      margin-bottom: 5px;

      color: #999;

      font-size: 10px;
    }


    .checkout-item-price strong {
      color: #222;

      font-size: 18px;

      font-weight: 700;
    }


    /* =====================================================
       TOTAL
    ===================================================== */

    .checkout-total-area {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      padding: 27px 0;

      margin-bottom: 75px;

      border-bottom: 1px solid #d4d1ca;
    }


    .checkout-total-label > span {
      display: block;

      margin-bottom: 9px;

      color: #99958e;

      font-size: 9px;

      font-weight: 650;

      letter-spacing: 0.24em;
    }


    .checkout-total-label p {
      margin: 0;

      color: #777;

      font-size: 12px;
    }


    .checkout-total-label p strong {
      color: #222;

      font-weight: 650;
    }


    .checkout-total-price {
      text-align: right;
    }


    .checkout-total-price span {
      display: block;

      margin-bottom: 5px;

      color: #88847d;

      font-size: 11px;
    }


    .checkout-total-price strong {
      color: #1f1f1f;

      font-size: 30px;

      font-weight: 750;

      letter-spacing: -0.04em;
    }


    /* =====================================================
       INFORMATION
    ===================================================== */

    .checkout-information {
      margin-bottom: 0;
    }


    .checkout-form {
      padding-top: 32px;
    }


    .form-row {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 35px;

      margin-bottom: 28px;
    }


    .form-group label {
      display: block;

      margin-bottom: 9px;

      color: #4c4945;

      font-size: 11px;

      font-weight: 650;
    }


    .form-group input,
    .form-group select,
    .form-group textarea {
      display: block;

      width: 100%;

      padding: 11px 0;

      border: 0;

      border-bottom: 1px solid #c9c6bf;

      border-radius: 0;

      outline: none;

      background: transparent;

      color: #222;

      font-size: 13px;
    }


    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #aaa;
    }


    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-bottom-color: #222;
    }


    .form-group textarea {
      min-height: 90px;

      resize: vertical;
    }


    .form-note {
      margin-top: 3px;
    }


    /* =====================================================
       SUBMIT
    ===================================================== */

    .checkout-submit-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 25px;

      margin-top: 40px;

      padding-top: 23px;

      border-top: 1px solid #d7d4ce;
    }


    .checkout-submit-row p {
      margin: 0;

      color: #999;

      font-size: 11px;
    }


    .checkout-submit {
      flex-shrink: 0;

      min-width: 220px;

      padding: 15px 28px;

      border: 0;

      border-radius: 2px;

      background: #242424;

      color: #fff;

      font-size: 12px;

      font-weight: 650;

      letter-spacing: 0.07em;

      cursor: pointer;
    }


    .checkout-submit:hover {
      background: #444;
    }


    /* =====================================================
       EMPTY
    ===================================================== */

    .checkout-empty {
      padding: 55px 0;

      text-align: center;
    }


    .checkout-empty p {
      margin: 0;

      color: #999;

      font-size: 13px;
    }


    .back-to-shop {
      display: inline-block;

      margin-top: 15px;

      font-size: 12px;

      text-decoration: underline;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 650px) {


      .header-inner {
        width: calc(100% - 28px);

        height: 62px;
      }


      .header-nav {
        gap: 14px;
      }


      .header-nav a {
        font-size: 10px;
      }


      .checkout-page {
        width: calc(100% - 28px);

        padding-top: 42px;

        padding-bottom: 55px;
      }


      .checkout-hero {
        margin-bottom: 42px;
      }


      .checkout-hero h1 {
        font-size: 40px;
      }


      .checkout-item {
        grid-template-columns: minmax(0, 1fr) auto;

        column-gap: 15px;

        padding: 21px 0;
      }


      .checkout-item-info h3 {
        font-size: 15px;
      }


      .checkout-item-price strong {
        font-size: 15px;
      }


      .checkout-total-area {
        margin-bottom: 55px;

        padding: 23px 0;
      }


      .checkout-total-price strong {
        font-size: 25px;
      }


      .form-row {
        grid-template-columns: 1fr;

        gap: 25px;

        margin-bottom: 25px;
      }


      .checkout-submit-row {
        flex-direction: column;

        align-items: stretch;

        margin-top: 32px;
      }


      .checkout-submit {
        width: 100%;
      }

    }

  </style>

</head>



<body>


  <!-- HEADER -->

  <header class="site-header">

    <div class="header-inner">

      <a
        href="index.html"
        class="logo"
      >
        ASTER4
      </a>


      <nav class="header-nav">

        <a href="index.html">
          首頁
        </a>

        <a href="cart.html">
          購物車
          <span id="cart-count">0</span>
        </a>

        <a href="order-search.html">
          訂單查詢
        </a>

      </nav>

    </div>

  </header>



  <main class="checkout-page">


    <!-- HERO -->

    <section class="checkout-hero">

      <div class="checkout-hero-top">

        <span>
          CHECKOUT
        </span>

        <span>
          ASTER4
        </span>

      </div>


      <h1>
        確認訂單
      </h1>


      <p>
        確認商品內容，再填寫訂購資訊
      </p>

    </section>



    <!-- ORDER -->

    <section class="checkout-order">

      <div class="section-heading">

        <span>
          YOUR ORDER
        </span>

        <h2>
          訂單商品
        </h2>

      </div>


      <div
        id="checkout-items"
        class="checkout-items"
      ></div>

    </section>



    <!-- TOTAL -->

    <section class="checkout-total-area">

      <div class="checkout-total-label">

        <span>
          ORDER SUMMARY
        </span>

        <p>
          商品
          <strong id="checkout-item-count">
            —
          </strong>
        </p>

      </div>


      <div class="checkout-total-price">

        <span>
          訂單總額
        </span>

        <strong id="checkout-total">
          NT$ 0
        </strong>

      </div>

    </section>



    <!-- INFORMATION -->

    <section class="checkout-information">

      <div class="section-heading">

        <span>
          INFORMATION
        </span>

        <h2>
          訂購人資料
        </h2>

      </div>


      <form
        id="checkout-form"
        class="checkout-form"
      >


        <div class="form-row">


          <div class="form-group">

            <label for="customer-name">
              本名姓名
            </label>

            <input
              type="text"
              id="customer-name"
              name="customerName"
              placeholder="請輸入姓名"
              required
            >

          </div>


          <div class="form-group">

            <label for="social-account">
              社群帳號
            </label>

            <input
              type="text"
              id="social-account"
              name="socialAccount"
              placeholder="例如：Instagram / Threads"
              required
            >

          </div>


        </div>



        <div class="form-row">


          <div class="form-group">

            <label for="phone">
              手機號碼
            </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="請輸入手機號碼"
              required
            >

          </div>


          <div class="form-group">

            <label for="delivery">
              取貨方式
            </label>

            <select
              id="delivery"
              name="delivery"
              required
            >

              <option value="">
                請選擇取貨方式
              </option>

              <option value="賣貨便">
                賣貨便
              </option>

              <option value="7-11店到店">
                7-11 店到店
              </option>

              <option value="其他">
                其他
              </option>

            </select>

          </div>


        </div>



        <div class="form-group form-note">

          <label for="note">
            備註
          </label>

          <textarea
            id="note"
            name="note"
            rows="4"
            placeholder="有其他想告訴 ASTER4 的事情，可以寫在這裡"
          ></textarea>

        </div>



        <div class="checkout-submit-row">

          <p>
            送出前請確認商品數量與訂購資訊
          </p>


          <button
            type="submit"
            class="checkout-submit"
          >
            確認送出訂單
          </button>

        </div>


      </form>

    </section>


  </main>



  <script src="checkout.js"></script>

</body>

</html>
```
