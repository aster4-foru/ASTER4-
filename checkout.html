<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASTER4｜確認訂單</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="header-inner">

      <a
        href="index.html"
        class="logo"
      >
        ASTER4
      </a>


      <nav class="header-nav">

        <a href="index.html">
          首頁
        </a>

        <a href="cart.html">
          購物車
          <span id="cart-count">0</span>
        </a>

        <a href="order-search.html">
          訂單查詢
        </a>

      </nav>

    </div>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="checkout-page">


    <!-- =========================
         HERO
    ========================== -->

    <section class="checkout-hero">

      <div class="checkout-hero-top">

        <span>
          CHECKOUT
        </span>

        <span>
          ASTER4
        </span>

      </div>


      <h1>
        確認訂單
      </h1>


      <p>
        確認商品內容，再填寫訂購資訊
      </p>

    </section>



    <!-- =========================
         ORDER
    ========================== -->

    <section class="checkout-order">


      <div class="section-heading">

        <span>
          YOUR ORDER
        </span>

        <h2>
          訂單商品
        </h2>

      </div>


      <div
        id="checkout-items"
        class="checkout-items"
      ></div>


    </section>



    <!-- =========================
         ORDER SUMMARY
    ========================== -->

    <section class="checkout-total-area">


      <div class="checkout-total-label">

        <span>
          ORDER SUMMARY
        </span>

        <p>
          商品
          <strong id="checkout-item-count">
            —
          </strong>
        </p>

      </div>


      <div class="checkout-total-price">

        <span>
          訂單總額
        </span>

        <strong id="checkout-total">
          NT$ 0
        </strong>

      </div>


    </section>



    <!-- =========================
         INFORMATION
    ========================== -->

    <section class="checkout-information">


      <div class="section-heading">

        <span>
          INFORMATION
        </span>

        <h2>
          訂購人資料
        </h2>

      </div>



      <form
        id="checkout-form"
        class="checkout-form"
      >


        <div class="form-row">


          <div class="form-group">

            <label for="customer-name">
              本名姓名
            </label>

            <input
              type="text"
              id="customer-name"
              name="customerName"
              placeholder="請輸入姓名"
              required
            >

          </div>


          <div class="form-group">

            <label for="social-account">
              社群帳號
            </label>

            <input
              type="text"
              id="social-account"
              name="socialAccount"
              placeholder="例如：Instagram / Threads"
              required
            >

          </div>


        </div>



        <div class="form-row">


          <div class="form-group">

            <label for="phone">
              手機號碼
            </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="請輸入手機號碼"
              required
            >

          </div>


          <div class="form-group">

            <label for="delivery">
              取貨方式
            </label>

            <select
              id="delivery"
              name="delivery"
              required
            >

              <option value="">
                請選擇取貨方式
              </option>

              <option value="賣貨便">
                賣貨便
              </option>

              <option value="7-11店到店">
                7-11 店到店
              </option>

              <option value="其他">
                其他
              </option>

            </select>

          </div>


        </div>



        <div class="form-group form-note">

          <label for="note">
            備註
          </label>

          <textarea
            id="note"
            name="note"
            rows="4"
            placeholder="有其他想告訴 ASTER4 的事情，可以寫在這裡"
          ></textarea>

        </div>



        <div class="checkout-submit-row">

          <p>
            送出前請確認商品數量與訂購資訊
          </p>


          <button
            type="submit"
            class="checkout-submit"
          >
            確認送出訂單
          </button>

        </div>


      </form>

    </section>


  </main>



  <script src="checkout.js"></script>


</body>

</html>
