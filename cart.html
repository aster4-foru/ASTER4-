<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASTER4｜購物車</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
<link
  rel="stylesheet"
  href="./cart.css"
>
</head>


<body>


  <!-- =========================
       Header
  ========================== -->

  <header class="site-header">

    <div class="header-inner">

      <a
        href="index.html"
        class="logo"
      >
        ASTER4
      </a>


      <nav class="header-nav">

        <a
          href="index.html"
        >
          首頁
        </a>


        <a
          href="cart.html"
          class="active"
        >
          購物車
          <span id="cart-count">
            0
          </span>
        </a>


        <a
          href="order-search.html"
        >
          訂單查詢
        </a>

      </nav>

    </div>

  </header>



  <!-- =========================
       Main
  ========================== -->

  <main class="cart-page">


    <div class="cart-title">

      <span>
        YOUR CART
      </span>

      <h1>
        購物車
      </h1>

      <p>
        確認你想購買的商品
      </p>

    </div>



    <!-- Cart Items -->

    <section
      id="cart-list"
      class="cart-list"
    >
    </section>



    <!-- Cart Summary -->

    <section
      id="cart-summary"
      class="cart-summary"
    >
    </section>


  </main>



  <!-- =========================
       JavaScript
  ========================== -->

  <script src="cart.js"></script>

</html>
