<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASTER4｜GROUP ORDER</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      background: #f5f1e8;

      color: #292925;

      font-family:
        "Noto Sans TC",
        "Noto Sans",
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button {
      font: inherit;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .site-header {
      width: 100%;

      border-bottom: 1px solid #ddd8cc;

      background: rgba(
        245,
        241,
        232,
        0.96
      );
    }


    .header-inner {
      width: min(
        1120px,
        calc(100% - 48px)
      );

      height: 72px;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .logo {
      color: #465344;

      font-size: 20px;

      font-weight: 700;

      letter-spacing: 0.12em;
    }


    .header-nav {
      display: flex;

      align-items: center;

      gap: 28px;
    }


    .header-nav a {
      color: #74776f;

      font-size: 12px;

      transition: color 0.2s ease;
    }


    .header-nav a:hover {
      color: #4e5f4b;
    }


    .cart-count {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 18px;

      height: 18px;

      margin-left: 3px;

      border-radius: 50%;

      background: #7f927d;

      color: #fff;

      font-size: 9px;
    }


    /* =====================================================
       GROUP HERO
    ===================================================== */

    .group-hero {
      position: relative;

      width: min(
        1120px,
        calc(100% - 48px)
      );

      margin: 0 auto;

      padding: 65px 0 55px;

      border-bottom: 1px solid #ddd8cc;
    }


    .group-hero-label {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 17px;

      color: #82927f;

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 0.24em;
    }


    .group-hero-label::before {
      content: "";

      width: 22px;

      height: 1px;

      background: #9caf98;
    }


    .group-info .group-id {
      display: none;
    }


    .group-info h1 {
      margin: 0;

      max-width: 760px;

      color: #3f4b3d;

      font-size: clamp(
        38px,
        5vw,
        52px
      );

      line-height: 1.15;

      font-weight: 650;

      letter-spacing: -0.045em;
    }


    .group-info p {
      margin: 13px 0 0;

      color: #85867f;

      font-size: 13px;

      line-height: 1.8;

      letter-spacing: 0.05em;
    }


    .hero-clover {
      position: absolute;

      right: 8px;

      bottom: 32px;

      color: #82977d;

      font-size: 28px;

      opacity: 0.55;

      transform: rotate(-8deg);
    }


    /* =====================================================
       PRODUCT SECTION
    ===================================================== */

    .products-section {
      padding: 55px 0 90px;
    }


    .products-inner {
      width: min(
        1120px,
        calc(100% - 48px)
      );

      margin: 0 auto;
    }


    .products-heading {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      margin-bottom: 25px;
    }


    .products-heading-label {
      display: block;

      margin-bottom: 7px;

      color: #879582;

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 0.25em;
    }


    .products-heading h2 {
      margin: 0;

      color: #394137;

      font-size: 25px;

      font-weight: 650;

      letter-spacing: -0.03em;
    }


    .products-heading-note {
      color: #99978f;

      font-size: 11px;
    }


    /* =====================================================
       PRODUCT LIST
    ===================================================== */

    .product-list {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    /* =====================================================
       HORIZONTAL PRODUCT CARD
    ===================================================== */

    .product-item {
      width: 100%;

      min-height: 138px;

      display: flex;

      align-items: stretch;

      overflow: hidden;

      background: #fbfaf6;

      border: 1px solid #e0dbd0;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    .product-item:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 25px
        rgba(
          75,
          79,
          67,
          0.08
        );
    }


    /* =====================================================
       SMALL IMAGE
    ===================================================== */

    .product-item-image {
      width: 138px;

      min-width: 138px;

      height: 138px;

      overflow: hidden;

      background: #e7e3da;
    }


    .product-item-image img {
      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

      transition:
        transform 0.35s ease;
    }


    .product-item:hover
    .product-item-image img {
      transform: scale(1.035);
    }


    .no-image {
      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #999890;

      font-size: 9px;

      letter-spacing: 0.2em;
    }


    /* =====================================================
       PRODUCT INFO
    ===================================================== */

    .product-item-info {
      flex: 1;

      min-width: 0;

      padding: 22px 25px;

      display: flex;

      flex-direction: column;

      justify-content: center;
    }


    .product-channel {
      margin-bottom: 6px;

      color: #82927f;

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }


    .product-item-name {
      margin: 0;

      color: #3d423b;

      font-size: 17px;

      line-height: 1.5;

      font-weight: 650;

      letter-spacing: -0.02em;
    }


    .product-version {
      margin-top: 5px;

      color: #85867f;

      font-size: 11px;

      line-height: 1.7;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    .product-status {
      width: fit-content;

      margin-top: 9px;

      padding: 4px 8px;

      border-radius: 2px;

      font-size: 8px;

      letter-spacing: 0.08em;
    }


    .product-status.is-open {
      background: #e0e9dd;

      color: #60735d;
    }


    .product-status.is-closed {
      background: #e7e4dd;

      color: #8b8981;
    }


    /* =====================================================
       ACTION AREA
    ===================================================== */

    .product-action {
      width: 170px;

      min-width: 170px;

      padding: 22px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-left: 1px solid #e4dfd5;
    }


    .buy-button {
      width: 100%;

      min-height: 42px;

      border: 1px solid #71836e;

      border-radius: 2px;

      background: #71836e;

      color: #fff;

      cursor: pointer;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 0.08em;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }


    .buy-button:hover {
      background: #60725d;

      transform: translateY(-1px);
    }


    .disabled-button {
      width: 100%;

      min-height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      border: 1px solid #d2cec5;

      border-radius: 2px;

      background: #e8e5dd;

      color: #8d8b83;

      font-size: 10px;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .site-footer {
      padding: 42px 0;

      background: #4d594b;

      color: #eef1eb;
    }


    .footer-inner {
      width: min(
        1120px,
        calc(100% - 48px)
      );

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .footer-logo {
      font-size: 17px;

      font-weight: 700;

      letter-spacing: 0.13em;
    }


    .footer-clover {
      margin-left: 7px;

      opacity: 0.7;
    }


    .footer-text {
      color: #c9d0c6;

      font-size: 10px;

      line-height: 1.7;

      text-align: right;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading-state {
      padding: 65px 20px;

      color: #8f8f87;

      text-align: center;

      font-size: 12px;

      letter-spacing: 0.05em;
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 800px) {


      .header-inner {
        width: calc(100% - 30px);

        height: 65px;
      }


      .logo {
        font-size: 18px;
      }


      .header-nav {
        gap: 14px;
      }


      .header-nav a {
        font-size: 10px;
      }


      .group-hero {
        width: calc(100% - 30px);

        padding: 52px 0 45px;
      }


      .group-info h1 {
        font-size: 39px;
      }


      .hero-clover {
        right: 0;

        bottom: 25px;

        font-size: 24px;
      }


      .products-section {
        padding: 50px 0 70px;
      }


      .products-inner {
        width: calc(100% - 30px);
      }


      .products-heading {
        display: block;

        margin-bottom: 22px;
      }


      .products-heading h2 {
        font-size: 23px;
      }


      .products-heading-note {
        margin-top: 8px;
      }


      .product-item {
        min-height: 120px;
      }


      .product-item-image {
        width: 120px;

        min-width: 120px;

        height: 120px;
      }


      .product-item-info {
        padding: 17px 18px;
      }


      .product-item-name {
        font-size: 15px;
      }


      .product-version {
        font-size: 10px;
      }


      .product-action {
        width: 130px;

        min-width: 130px;

        padding: 15px;
      }


      .buy-button,
      .disabled-button {
        min-height: 38px;

        font-size: 9px;
      }


      .footer-inner {
        width: calc(100% - 30px);

        display: block;
      }


      .footer-text {
        margin-top: 13px;

        text-align: left;
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 560px) {


      .product-item {
        min-height: 112px;
      }


      .product-item-image {
        width: 100px;

        min-width: 100px;

        height: 112px;
      }


      .product-item-info {
        padding: 14px 14px;
      }


      .product-channel {
        margin-bottom: 4px;

        font-size: 8px;
      }


      .product-item-name {
        font-size: 14px;

        line-height: 1.4;
      }


      .product-version {
        margin-top: 3px;

        font-size: 9px;
      }


      .product-status {
        margin-top: 6px;

        padding: 3px 6px;

        font-size: 7px;
      }


      .product-action {
        width: 100px;

        min-width: 100px;

        padding: 10px;
      }


      .buy-button,
      .disabled-button {
        min-height: 36px;

        padding: 0 6px;

        font-size: 8px;
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
    ===================================================== */

    @media (max-width: 390px) {


      .product-item-image {
        width: 82px;

        min-width: 82px;
      }


      .product-item-info {
        padding: 12px 10px;
      }


      .product-item-name {
        font-size: 13px;
      }


      .product-action {
        width: 88px;

        min-width: 88px;

        padding: 8px;
      }

    }

  </style>

</head>



<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <div class="header-inner">


      <a
        href="index.html"
        class="logo"
      >
        ASTER4
      </a>


      <nav class="header-nav">


        <a href="index.html">
          首頁
        </a>


        <a href="cart.html">
          購物車
          <span
            id="cart-count"
            class="cart-count"
          >
            0
          </span>
        </a>


        <a href="order-search.html">
          訂單查詢
        </a>


      </nav>


    </div>

  </header>



  <!-- =====================================================
       GROUP HERO
  ====================================================== -->

  <section class="group-hero">


    <div class="group-hero-label">
      ASTER4 GROUP ORDER
    </div>


    <section
      id="group-info"
      class="group-info"
    >

      <div class="loading-state">
        載入中...
      </div>

    </section>


    <div class="hero-clover">
      🍀
    </div>


  </section>



  <!-- =====================================================
       PRODUCTS
  ====================================================== -->

  <section class="products-section">


    <div class="products-inner">


      <div class="products-heading">


        <div>

          <span class="products-heading-label">
            AVAILABLE ITEMS
          </span>


          <h2>
            商品選擇
          </h2>

        </div>


        <div class="products-heading-note">
          Choose your version
        </div>


      </div>



      <section
        id="product-list"
        class="product-list"
      >

      </section>


    </div>


  </section>



  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="site-footer">


    <div class="footer-inner">


      <div class="footer-logo">

        ASTER4

        <span class="footer-clover">
          🍀
        </span>

      </div>


      <div class="footer-text">

        K-POP GROUP ORDER<br>

        © ASTER4

      </div>


    </div>


  </footer>



  <script src="product.js?v=3"></script>



  <!-- =====================================================
       CART COUNT
  ====================================================== -->

  <script>

    function updateCartCount() {

      try {

        const cart =
          JSON.parse(
            localStorage.getItem(
              "ASTER4_CART"
            ) || "[]"
          );


        const count =
          cart.reduce(
            function(total, item) {

              return (
                total +
                Number(
                  item.quantity || 0
                )
              );

            },
            0
          );


        const element =
          document.getElementById(
            "cart-count"
          );


        if (element) {

          element.textContent =
            count;

        }

      } catch (error) {

        console.error(
          "購物車數量讀取失敗：",
          error
        );

      }

    }


    document.addEventListener(
      "DOMContentLoaded",
      function() {

        updateCartCount();

      }
    );

  </script>


</body>

</html>
